{% extends "base_page.html" %}
{% load static %}

{% block page_title %}
<div style="max-width: 60%; margin: 0 auto;">
    <h2 class="text-center mb-4 fs-1">🇫🇷 Увлекательная мини-викторина</h2>
</div>
{% endblock %}

{% block content %}
<div class="container d-flex flex-column align-items-center justify-content-center">
    <div class="progress w-100 mb-3" style="height: 10px;">
        <div class="progress-bar bg-primary" id="progress-bar" role="progressbar" style="width: 0%"></div>
    </div>

    <div class="card shadow p-4 mb-4" style="max-width: 1000px; width: 100%;">
        <div class="text-center mb-3">
            <div class="fs-4 fw-bold text-danger" id="timer">10</div>
        </div>
        <div class="text-center mb-4">
            <h4 id="question" class="fw-bold"></h4>
        </div>
        <div id="options" class="d-grid gap-3 mb-3" style="grid-template-columns: 1fr 1fr;"></div>
        <div id="feedback" class="feedback p-3 rounded text-center d-none"></div>
        <div class="text-center">
            <button id="next-btn" class="btn btn-primary d-none">Следующий вопрос</button>
        </div>
    </div>

    <div id="result" class="text-center d-none mt-4">
        <div class="fs-1" id="result-emoji"></div>
        <div class="fs-4 mb-3" id="result-text"></div>
        <button class="btn btn-outline-primary" onclick="location.reload()">Пройти ещё раз</button>
    </div>
</div>

<script>
    const questions = [
        {
            question: "Как сказать 'Спасибо' по-французски?",
            options: ["Au revoir", "Merci", "S’il vous plaît", "Excusez-moi"],
            correct: 1,
            feedback: "Правильно! 'Merci' — это спасибо. Французы говорят его очень часто!",
            funFact: "Интересный факт: во Франции принято говорить 'Merci beaucoup' даже за мелкие услуги."
        },
        {
            question: "Что означает 'Pain'?",
            options: ["Вода", "Кофе", "Хлеб", "Сыр"],
            correct: 2,
            feedback: "Верно! 'Pain' — это хлеб.",
            funFact: "Французы съедают около 10 миллиардов багетов в год!"
        },
        {
            question: "Как будет '5' по-французски?",
            options: ["Trois", "Cinq", "Sept", "Dix"],
            correct: 1,
            feedback: "Точно! 'Cinq' — это пять.",
            funFact: "Французские цифры после 70 считаются странно: 80 — 'quatre-vingts'."
        },
        {
            question: "Выберите правильный перевод для 'Petit'",
            options: ["Большой", "Маленький", "Хороший", "Друг"],
            correct: 1,
            feedback: "Да! 'Petit' — маленький.",
            funFact: "В Париже есть ресторан 'Le Petit Nice' — но он совсем не маленький!"
        },
        {
            question: "Какое слово означает 'Пить'?",
            options: ["Manger", "Boire", "Parler", "Aller"],
            correct: 1,
            feedback: "Правильно! 'Boire' — пить.",
            funFact: "Французы пьют кофе из маленьких чашек и не берут его 'с собой'."
        }
    ];

    let currentQuestion = 0;
    let score = 0;
    let timeLeft = 10;
    let timer;

    const questionEl = document.getElementById('question');
    const optionsEl = document.getElementById('options');
    const feedbackEl = document.getElementById('feedback');
    const nextBtn = document.getElementById('next-btn');
    const timerEl = document.getElementById('timer');
    const progressBar = document.getElementById('progress-bar');
    const resultEl = document.getElementById('result');
    const resultText = document.getElementById('result-text');
    const resultEmoji = document.getElementById('result-emoji');

    function startQuiz() {
        currentQuestion = 0;
        score = 0;
        showQuestion();
    }

    function showQuestion() {
        clearInterval(timer);
        timeLeft = 10;
        timerEl.textContent = timeLeft;
        startTimer();


        const q = questions[currentQuestion];
        questionEl.textContent = q.question;
        optionsEl.innerHTML = '';
        progressBar.style.width = `${(currentQuestion / questions.length) * 100}%`;

        q.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'btn btn-outline-secondary option-btn';
            btn.textContent = opt;
            btn.onclick = () => selectAnswer(idx);
            optionsEl.appendChild(btn);
        });

        feedbackEl.classList.add('d-none');
        nextBtn.classList.add('d-none');
    }

    function startTimer() {
        timer = setInterval(() => {
            timeLeft--;
            timerEl.textContent = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(timer);
                timeUp();
            }
        }, 1000);
    }

    function timeUp() {
        showFeedback(false, "Время вышло! Правильный ответ: " + questions[currentQuestion].options[questions[currentQuestion].correct]);
    }

    function selectAnswer(index) {
    if (timeLeft <= 0) return; // <-- предотвращаем выбор после истечения времени
    clearInterval(timer);
    timeLeft = 0;
    timerEl.textContent = timeLeft;

    const q = questions[currentQuestion];
    const isCorrect = index === q.correct;

    const optionButtons = document.querySelectorAll('.option-btn');
    optionButtons.forEach((btn, i) => {
        btn.disabled = true;
        if (i === q.correct) btn.classList.add('btn-success');
        if (i === index && !isCorrect) btn.classList.add('btn-danger');
    });

    if (isCorrect) score++;

    showFeedback(isCorrect, q.feedback + "<br><small class='text-muted'>" + q.funFact + "</small>");
}


    function showFeedback(correct, message) {
        feedbackEl.innerHTML = message;
        feedbackEl.className = `feedback p-3 rounded text-center mt-3 mb-4 ${correct ? 'bg-success-subtle text-dark' : 'bg-danger-subtle text-dark'}`;
        feedbackEl.classList.remove('d-none');
        nextBtn.classList.remove('d-none');
    }

    function nextQuestion() {
        currentQuestion++;
        if (currentQuestion < questions.length) {
            showQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.querySelector('.card').classList.add('d-none');
        progressBar.style.width = '100%';
        resultEl.classList.remove('d-none');

        const percentage = Math.round((score / questions.length) * 100);
        let emoji = '📚';
        let msg = `Ты набрал ${score} из ${questions.length}.`;

        if (percentage >= 80) {
            emoji = '🥖';
            msg = `Ты настоящий француз! ${score} из ${questions.length}!`;
        } else if (percentage >= 50) {
            emoji = '🥐';
            msg = `Très bien! ${score} из ${questions.length}. Немного практики — и вперёд!`;
        }

        resultEmoji.textContent = emoji;
        resultText.textContent = msg;
    }

    nextBtn.addEventListener('click', nextQuestion);
    startQuiz();
</script>
{% endblock %}
